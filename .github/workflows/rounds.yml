name: Outreach rounds

# Runs one round, on demand.
#
# There is no schedule here any more. GitHub never fired one: the workflow sat registered
# and active for hours while every slot went past, which is the known shape of scheduled
# Actions being best-effort on a shared queue. Email going out on time is a poor fit for
# best-effort, so the schedule moved to cron-job.org, with the two entries in vercel.json
# still covering 09:00 and 15:00 as a floor.
#
# Kept for manual runs, which is what it was most useful for anyway.
#
# The endpoint is a plain authenticated GET and answers straight away, doing the work
# afterwards, so anything able to make an HTTP request on a timer can drive it:
#   curl -H "Authorization: Bearer $CRON_SECRET" https://your-site/api/cron
#
# Needs two repository secrets under Settings -> Secrets -> Actions:
#   SITE_URL      https://outreach.norrkusten.se   (no trailing slash)
#   CRON_SECRET   the same value the site has, from its Production environment
#
# "Rounds a day" in the app's Settings has to match however many times a day the endpoint
# is actually called, whoever calls it, or the early rounds spend the whole daily
# allowance and the later ones find none left.

on:
  workflow_dispatch:

# One round at a time. Two overlapping rounds would each get the full per-round
# allowance and between them double the intended rate.
concurrency:
  group: outreach-rounds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run a round
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets are not set." >&2
            exit 1
          fi

          # Trim surrounding whitespace. Pasting a secret very easily carries a trailing
          # newline, and the header then reads "Bearer abc123\n" and is rejected as
          # confidently as a wrong value, with nothing on screen to tell the two apart.
          secret=$(printf '%s' "${CRON_SECRET}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          site=$(printf '%s' "${SITE_URL}" | sed -e 's/^[[:space:]]*//' -e 's#[[:space:]/]*$##')

          # The body carries the previous round's result, since this one has only just
          # started. Printing it is the quickest way to see whether rounds are healthy.
          code=$(curl --silent --show-error --max-time 60 \
            -o response.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${secret}" \
            "${site}/api/cron") || true
          cat response.txt

          if [ "$code" = "401" ]; then
            echo "" >&2
            echo "The site rejected the token. The CRON_SECRET repository secret does not" >&2
            echo "match CRON_SECRET in the site's Production environment." >&2
            echo "Note that 'vercel env pull' writes the Development value, which is often" >&2
            echo "a different one. Copy the Production value, or set the same new value in" >&2
            echo "both places and redeploy so the site picks it up." >&2
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "" >&2
            echo "Round failed to start with HTTP $code." >&2
            exit 1
          fi
